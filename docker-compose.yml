services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    image: tehila2163/focusflow-backend:latest
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-focusflow-local-development-only}
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    image: tehila2163/focusflow-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data: