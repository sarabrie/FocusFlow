server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api ו-/health מועברים לשרת רק כש-BACKEND_URL מוגדר (docker compose).
    # בענן ה-Load Balancer מנתב אותם, והתיקייה הזו נשארת ריקה.
    # הקובץ נוצר בעלייה על ידי 40-backend-proxy.sh.
    include /etc/nginx/backend-proxy/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
